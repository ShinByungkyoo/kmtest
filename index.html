<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>날씨 정보</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: #fff;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }
    form { display: flex; gap: 8px; margin-bottom: 24px; }
    input {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: #1e3a8a;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #1e40af; }
    .city { font-size: 1.5rem; font-weight: bold; }
    .desc { margin-top: 4px; opacity: 0.9; }
    .icon { width: 120px; height: 120px; }
    .temp { font-size: 3.5rem; font-weight: bold; }
    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    .detail {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px;
      font-size: 0.9rem;
    }
    .detail b { display: block; font-size: 1.1rem; margin-top: 2px; }
    .msg { padding: 20px 0; }
  </style>
</head>
<body>
  <div class="card">
    <form id="form">
      <input id="city" type="text" placeholder="도시 이름 (예: Seoul)" value="광명">
      <button type="submit">검색</button>
    </form>
    <div id="result" class="msg">불러오는 중...</div>
  </div>

  <script>
    const API_KEY = "dca15146dd0f70c3faeeccdc288cfbc5";
    const result = document.getElementById("result");

    async function getWeather(city) {
      result.className = "msg";
      result.textContent = "불러오는 중...";
      try {
        // 도시 이름 → 좌표 (한글/영문 모두 지원)
        const geoRes = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(city)}&limit=1&appid=${API_KEY}`);
        const geo = await geoRes.json();
        if (!geoRes.ok) throw new Error(geo.message || "요청 실패");
        if (!geo.length) throw new Error("도시를 찾을 수 없습니다");

        const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${geo[0].lat}&lon=${geo[0].lon}&appid=${API_KEY}&units=metric&lang=kr`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "요청 실패");
        data.name = geo[0].local_names?.ko || geo[0].name;

        result.className = "";
        result.innerHTML = `
          <div class="city">${data.name}, ${data.sys.country}</div>
          <div class="desc">${data.weather[0].description}</div>
          <img class="icon" src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png" alt="">
          <div class="temp">${Math.round(data.main.temp)}°C</div>
          <div class="details">
            <div class="detail">체감온도<b>${Math.round(data.main.feels_like)}°C</b></div>
            <div class="detail">습도<b>${data.main.humidity}%</b></div>
            <div class="detail">풍속<b>${data.wind.speed} m/s</b></div>
            <div class="detail">기압<b>${data.main.pressure} hPa</b></div>
          </div>`;
      } catch (e) {
        result.className = "msg";
        result.textContent = "날씨를 가져오지 못했습니다: " + e.message;
      }
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const city = document.getElementById("city").value.trim();
      if (city) getWeather(city);
    });

    getWeather("광명");
  </script>
</body>
</html>
